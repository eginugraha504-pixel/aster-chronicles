# Politik guild bot SEMUA server, tiap 20 menit (22 Nov 2026).
# Politik guild dihitung oleh game (gSim) lalu dikirim ke server. Tanpa penjadwal ini, server yang tidak punya
# pemain online tidak pernah punya guild. Skrip: tools/gtick.mjs (membuka index.html tanpa layar memakai Chrome bawaan runner).
# Kunci tick = sha256('gtick:' + BANK_BOT_TOKEN) — secret yang sama dengan deploy bank, tidak perlu secret baru.
# Tick yang telat / terlewat dikejar otomatis oleh gSim (maks 3 hari). Server yang sudah dihitung game pemain dilewati.
name: Politik guild semua server
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
concurrency:
  group: guild-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            index.html
            tools/gtick.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock --silent playwright-core@1
      - name: Tick semua server
        env:
          BOT_TOKEN: ${{ secrets.BANK_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "::error::Secret BANK_BOT_TOKEN kosong"; exit 1; fi
          GTICK_KEY=$(printf 'gtick:%s' "$BOT_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$GTICK_KEY"
          export GTICK_KEY
          node tools/gtick.mjs index.html | tee -a $GITHUB_STEP_SUMMARY

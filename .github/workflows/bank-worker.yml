# Deploy bot Bank Central Universe (+ API Top Up) ke Cloudflare Workers.
# Butuh 3 secret di GitHub (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BANK_BOT_TOKEN
# Jalan otomatis saat folder bank-worker/ berubah, atau manual dari tab Actions (Run workflow).
name: Deploy bank bot (Cloudflare)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bank-worker/**', '.github/workflows/bank-worker.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BANK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i -g wrangler@4
      - name: Cek secret
        run: |
          miss=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v KOSONG"; miss=1; else echo "OK $v (${#v} karakter)"; fi
          done
          [ $miss = 0 ] || { echo "::error::Isi di Settings > Secrets and variables > Actions > tab Secrets > Repository secrets (BANK_BOT_TOKEN untuk token bot)"; exit 1; }
      - name: Database D1 (dibuat sekali)
        run: |
          getid() { wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name==='aster-bank');console.log(d?d.uuid:'')})"; }
          ID=$(getid)
          if [ -z "$ID" ]; then wrangler d1 create aster-bank; ID=$(getid); fi
          echo "D1: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - run: wrangler d1 migrations apply aster-bank --remote
      - run: wrangler deploy
      - name: Token bot
        run: printf '%s' "$BOT_TOKEN" | wrangler secret put BOT_TOKEN
      - name: Pasang webhook Telegram
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result.subdomain||'')}catch(e){console.log('')}})")
          if [ -z "$SUB" ]; then echo "::error::Akun Cloudflare belum punya subdomain workers.dev. Buka dash.cloudflare.com > Workers & Pages sekali, lalu jalankan ulang."; exit 1; fi
          URL="https://aster-bank.$SUB.workers.dev"
          K=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          sleep 5
          curl -s "$URL/setup?k=$K"; echo
          echo "### ✅ Bank aktif di $URL" >> $GITHUB_STEP_SUMMARY
          echo "Isi alamat ini di game: \`TOPUP_CFG.api = '$URL'\`" >> $GITHUB_STEP_SUMMARY

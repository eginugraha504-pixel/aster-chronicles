<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aster">
<meta name="theme-color" content="#3a2414">
<meta name="format-detection" content="telephone=no">
<title>Aster Chronicles: Ksatria Piksel</title>
<!-- @css -->
</head>
<body>
<div id="studio" aria-label="HUN2 STUDIO"><div class="stpetal"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="stin"><img id="stLogo" src="__STUDIO_LOGO__" alt="HUN2 STUDIO" draggable="false"><div class="stline"></div><p id="stDisc">Game masih dalam tahap pengembangan</p></div>
</div>
<div id="boot"><div class="bbg" id="bootBg"></div><div class="bvig"></div><div class="bstars" id="bootStars"></div>
 <div class="bhero" id="bootHero"></div>
 <div class="blogo"><div class="alogo"></div><div class="asub">Ksatria Piksel</div></div>
 <div class="binfo" id="bootInfo"></div>
 <div class="bbot">
  <div class="btip"><em>TIPS</em><p id="bootTip"></p></div>
  <div class="bline"><span id="bootSt">Memuat...</span><b id="bootPct">0%</b></div>
  <div class="bfr"><div class="bfill" id="bootFill"></div><i class="bglint" id="bootGlint"></i></div>
  <div class="bfoot">© HUN2 STUDIO</div>
 </div>
</div>
<div id="login"></div>
<div id="app">
 <header id="top"></header>
 <main id="screen"></main>
 <nav id="nav"></nav>
 <div id="battle">
  <div class="bcw"><canvas id="bc" width="480" height="600"></canvas>
   <div class="bvig"></div>
   <div class="bhud"><div class="bplq"><b id="bTitle"></b><small id="bSub"></small></div>
    <div class="bmid"><div class="bwv" id="bWave"></div><div class="btm" id="bTime">0:00</div></div>
    <button class="bpz" data-act="bpause" aria-label="Jeda"><i></i><i></i></button></div>
   <div class="bboss" id="bBoss"></div>
   <div id="cutin"></div><div id="bbanner"></div></div>
  <div class="blow"><div class="bheroes" id="bHeroes"></div>
   <div class="bctrl"><button class="bcb" id="bAuto" data-act="bauto"></button><div class="bhint" id="bHint"></div><button class="bcb spd" id="bSpd" data-act="bspeed"></button></div></div>
  <div class="bover" id="bOver"></div>
 </div>
 <div id="sfx"></div>
 <div id="modal"></div>
 <div id="toast"></div>
</div>
<!-- @js -->
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aster">
<meta name="theme-color" content="#3a2414">
<meta name="format-detection" content="telephone=no">
<title>Aster Chronicles: Ksatria Piksel</title>
<!-- @css -->
</head>
<body>
<div id="studio" aria-label="HUN2 STUDIO"><div class="stpetal"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="stin"><img id="stLogo" src="__STUDIO_LOGO__" alt="HUN2 STUDIO" draggable="false"><div class="stline"></div><p id="stDisc">Game masih dalam tahap pengembangan</p></div>
</div>
<div id="boot"><div class="bstars"></div>
 <div class="logo"><div class="lgstar"></div><div class="lgt"><span>ASTER</span></div><div class="lgr"><span>CHRONICLES</span></div><div class="lgs">Ksatria Piksel</div></div>
 <div class="bparty" id="bootParty"></div>
 <div class="bbar"><img class="px" id="bootRun" alt=""><div class="bfr"><div class="bfill" id="bootFill"></div></div><b id="bootPct">0%</b></div>
 <div class="bst" id="bootSt">Memuat...</div>
 <div class="btip"><p id="bootTip"></p></div>
</div>
<div id="login"></div>
<div id="app">
 <header id="top"></header>
 <main id="screen"></main>
 <nav id="nav"></nav>
 <div id="battle">
  <div class="bhead"><div class="bt"><b id="bTitle"></b><small id="bSub"></small></div><div class="wv" id="bWave"></div><div class="tm" id="bTime">0:00</div><button class="btn" data-act="bpause">II</button></div>
  <div class="bcw"><canvas id="bc" width="480" height="420"></canvas><div id="cutin"></div><div id="bbanner"></div></div>
  <div class="blow"><div class="bheroes" id="bHeroes"></div>
  <div class="bctrl"><button class="btn" id="bAuto" data-act="bauto">AUTO</button><button class="btn blue" id="bSpd" data-act="bspeed">x1</button></div>
  <div class="bhint" id="bHint"></div><div class="belg" id="bEl"></div></div>
  <div class="bover" id="bOver"></div>
 </div>
 <div id="sfx"></div>
 <div id="modal"></div>
 <div id="toast"></div>
</div>
<!-- @js -->
</body>
</html>
